<!doctype html>
<html>
  <body>
    <main aria-label="WhatsApp">
      <section data-testid="conversation-panel" data-message-list>
        <div data-testid="msg-container" data-message data-direction="incoming">Hi, what does this cost?</div>
        <div data-testid="msg-container" data-message data-direction="outgoing">Happy to help.</div>
      </section>
      <div role="textbox" aria-label="Type a message" data-composer contenteditable="true"></div>
      <button aria-label="Send" data-send>Send</button>
    </main>
  </body>
</html>
